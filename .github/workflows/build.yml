name: Byg app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer og byg web-appen
        run: |
          npm install
          npm run build

      - name: Udgiv web-appen på GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          folder: app
          branch: gh-pages

      - name: Lav Android-projektet
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#04070a' --iconBackgroundColorDark '#04070a' \
            --splashBackgroundColor '#04070a' --splashBackgroundColorDark '#04070a' \
            || echo "::warning::Ikoner kunne ikke genereres, bruger standardikon"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.VIBRATE" />#' "$MANIFEST"
          sed -i 's#android:name=".MainActivity"#& android:screenOrientation="portrait"#' "$MANIFEST"
          npx cap sync android

      - name: Byg APK
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../grid-breach.apk

      - name: Udgiv APK under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Grid Breach build ${{ github.run_number }}
          make_latest: true
          files: grid-breach.apk
          body: |
            Hent `grid-breach.apk` på din Android-telefon og åbn den for at installere.
            Første gang skal du tillade installation fra din browser eller filhåndtering.
            Nye builds kan installeres oven på den gamle, så din rekord bliver.
